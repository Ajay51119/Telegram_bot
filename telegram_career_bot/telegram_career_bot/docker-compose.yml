services:
  career-bot:
    build: .
    container_name: career_telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data   # keeps data/bot.db (user profiles) outside the container
    command: ["python", "bot.py"]

  api:
    build: .
    container_name: career_api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    command: ["uvicorn", "api_server:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - career-bot
